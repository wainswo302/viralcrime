spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/viralcrime}
    username: ${DB_USER:viralcrime}
    password: ${DB_PASSWORD:viralcrime}
  jpa:
    hibernate:
      ddl-auto: validate       # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
